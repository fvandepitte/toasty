name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build x64
        run: |
          cmake -S . -B build-x64 -G "Visual Studio 17 2022" -A x64
          cmake --build build-x64 --config Release

      - name: Build ARM64
        run: |
          cmake -S . -B build-arm64 -G "Visual Studio 17 2022" -A ARM64
          cmake --build build-arm64 --config Release

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Sign executables with Trusted Signing
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://wus2.codesigning.azure.net/
          trusted-signing-account-name: hanselman
          certificate-profile-name: WindowsEdgeLight
          files-folder: ${{ github.workspace }}
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force
          Copy-Item "build-x64/Release/toasty.exe" -Destination "artifacts/toasty-x64.exe"
          Copy-Item "build-arm64/Release/toasty.exe" -Destination "artifacts/toasty-arm64.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: toasty-windows
          path: artifacts/*.exe

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build x86_64
        run: |
          cmake -S . -B build-x86_64 -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build-x86_64 --config Release

      - name: Build ARM64
        run: |
          cmake -S . -B build-arm64 -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build-arm64 --config Release

      - name: Create universal binary
        run: |
          mkdir -p artifacts
          lipo -create build-x86_64/toasty build-arm64/toasty -output artifacts/toasty-universal
          chmod +x artifacts/toasty-universal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: toasty-macos
          path: artifacts/toasty-universal

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: toasty-windows
          path: windows-artifacts

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          name: toasty-macos
          path: macos-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            windows-artifacts/toasty-x64.exe
            windows-artifacts/toasty-arm64.exe
            macos-artifacts/toasty-universal
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
