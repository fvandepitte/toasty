name: Test Build

on:
  pull_request:
  push:
    branches: [main, develop, copilot/**]

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - name: Test executable
        run: |
          ./build/toasty --help
